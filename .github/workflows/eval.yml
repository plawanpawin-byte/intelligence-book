name: Evaluate note pipeline

# Runs only for pushes to the `eval` branch: tunes prompts against the real Llama 3.2 3B.
on:
  push:
    branches: [eval]

permissions:
  contents: write

concurrency:
  group: eval
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        run: echo "ids=$(python3 -c 'import json;print(json.dumps([j["id"] for j in json.load(open("tools/eval/jobs.json"))["jobs"]]))')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-llama32-3b-v1
      - name: Install
        run: |
          pip install -q mlx-lm || true
          python -c "import mlx.core as mx; print('metal', mx.metal.is_available())" || true
          brew install llama.cpp >/dev/null 2>&1 || true
          sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu hw.memsize
      - name: Run
        env:
          EVAL_OUT: out
        run: |
          cd tools/eval
          python run.py "${{ matrix.id }}" 2>&1 | tee "run-${{ matrix.id }}.log"
          mkdir -p out && cp "run-${{ matrix.id }}.log" out/ || true
          tail -50 llama-server.log 2>/dev/null > "out/${{ matrix.id }}.server.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.id }}
          path: tools/eval/out
      - name: Publish this job's result right away
        if: always()
        run: |
          git config --global user.name "eval-bot"
          git config --global user.email "eval-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf res
            git clone -q --depth 1 --branch eval-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" res || exit 0
            mkdir -p "res/runs/${{ github.run_number }}"
            cp tools/eval/out/* "res/runs/${{ github.run_number }}/" 2>/dev/null || true
            (cd res && git add -A && git commit -qm "eval run ${{ github.run_number }} ${{ matrix.id }}" && git push -q origin eval-results) && break
            sleep $((attempt * 7))
          done

  publish:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Push results to eval-results branch
        run: |
          git config --global user.name "eval-bot"
          git config --global user.email "eval-bot@users.noreply.github.com"
          git clone --depth 1 --branch eval-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" res \
            || { git init res && cd res && git checkout -b eval-results && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" && cd ..; }
          mkdir -p "res/runs/${{ github.run_number }}"
          find collected -type f -exec cp {} "res/runs/${{ github.run_number }}/" \;
          cd res && git add -A && git commit -qm "eval run ${{ github.run_number }} (${{ github.sha }})" && git push -q origin eval-results
