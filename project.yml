name: IntelligenceBook
options:
  bundleIdPrefix: com.plawan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  IntelligenceBook:
    type: application
    platform: iOS
    sources:
      - path: IntelligenceBook
    info:
      path: IntelligenceBook/Info.plist
      properties:
        CFBundleDisplayName: IntelligenceBook
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationQueriesSchemes: [obsidian]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: IntelligenceBook ใช้ไมโครโฟนเพื่ออัดเสียงบรรยายหรือการประชุมแล้วสรุปเป็นโน้ต
        NSSpeechRecognitionUsageDescription: IntelligenceBook แปลงเสียงที่อัดหรือไฟล์เสียงเป็นข้อความเพื่อนำไปสรุป
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plawan.intelligencebook
        PRODUCT_NAME: IntelligenceBook
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    scheme: {}
